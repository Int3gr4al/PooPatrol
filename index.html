<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Poo Patrol</title>
<link rel="manifest" href="manifest.webmanifest"/>
<meta name="theme-color" content="#5a7d3c"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Poo Patrol"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="preconnect" href="https://challenges.cloudflare.com"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Spline+Sans+Mono:wght@400;500&display=swap');

  :root{
    --ink:#1c2419;
    --paper:#f3efe3;
    --moss:#5a7d3c;
    --moss-dk:#415c29;
    --clay:#b5582f;
    --gold:#d8a838;
    --line:#cdc6b2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Spline Sans Mono',monospace;
    background:var(--paper);
    color:var(--ink);
    background-image:radial-gradient(circle at 1px 1px, rgba(28,36,25,.07) 1px, transparent 0);
    background-size:22px 22px;
    overflow:hidden;
  }
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}

  header{
    padding:14px 20px;border-bottom:2px solid var(--ink);
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--paper);z-index:600;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .logo{
    width:42px;height:42px;border-radius:50%;background:var(--moss);
    display:grid;place-items:center;font-size:22px;border:2px solid var(--ink);
    box-shadow:3px 3px 0 var(--ink);flex-shrink:0;
  }
  h1{font-family:'Fraunces',serif;font-weight:900;font-size:26px;line-height:.9;letter-spacing:-.5px}
  h1 small{display:block;font-family:'Spline Sans Mono';font-weight:400;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--moss-dk);margin-top:3px}
  .count{
    font-family:'Fraunces',serif;font-weight:700;font-size:13px;
    background:var(--ink);color:var(--paper);padding:6px 12px;border-radius:20px;
  }

  #map{flex:1;width:100%;z-index:1;position:relative}
  .leaflet-container{background:#dfdac9;font-family:'Spline Sans Mono',monospace}
  .leaflet-top.leaflet-left{margin-top:64px}

  .fab{
    position:absolute;bottom:calc(26px + env(safe-area-inset-bottom, 0px));
    left:50%;transform:translateX(-50%);
    z-index:1000;background:var(--clay);color:#fff;border:2px solid var(--ink);
    font-family:'Fraunces',serif;font-weight:700;font-size:16px;
    padding:14px 26px;border-radius:40px;cursor:pointer;
    box-shadow:4px 4px 0 var(--ink);display:flex;align-items:center;gap:8px;
    transition:transform .12s, box-shadow .12s;white-space:nowrap;
  }
  .fab:active{transform:translateX(-50%) translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
  .fab.armed{background:var(--moss)}

  .banner{
    position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:500;
    background:var(--gold);color:var(--ink);border:2px solid var(--ink);
    padding:9px 18px;border-radius:30px;font-size:13px;font-weight:500;
    box-shadow:3px 3px 0 var(--ink);white-space:nowrap;max-width:90vw;
    overflow:hidden;text-overflow:ellipsis;
    animation:pop .3s ease;
  }
  .banner.err{background:var(--clay);color:#fff}
  @keyframes pop{from{transform:translateX(-50%) scale(.8);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}

  /* locate button */
  .locate{
    position:absolute;top:14px;left:14px;z-index:1000;
    border:2px solid var(--ink);background:var(--gold);color:var(--ink);
    border-radius:30px;padding:11px 18px;cursor:pointer;
    font-family:'Fraunces',serif;font-weight:700;font-size:14px;
    box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s;
    display:flex;align-items:center;gap:6px;
  }
  .locate:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .locate:disabled{opacity:.7;cursor:wait}
  /* top-right control stack */
  .topright{position:absolute;top:14px;right:14px;z-index:1000;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .ctrl-btn{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:30px;padding:11px 16px;cursor:pointer;
    font-family:'Fraunces',serif;font-weight:700;font-size:13px;white-space:nowrap;
    box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s;
  }
  .ctrl-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .ctrl-btn.on{background:var(--moss);color:#fff}
  .ctrl-btn.active{background:var(--gold)}
  .filter-panel{
    display:none;background:var(--paper);border:2px solid var(--ink);
    border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:14px;
    width:210px;text-align:left;
  }
  .filter-panel.show{display:block}
  .fp-group{padding:4px 0;border-bottom:1px solid var(--line);margin-bottom:8px}
  .fp-group:last-of-type{border-bottom:none;margin-bottom:6px}
  .fp-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--moss-dk);margin-bottom:6px;font-weight:500}
  .fp-row{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0;cursor:pointer;font-family:'Spline Sans Mono',monospace}
  .fp-row input{width:16px;height:16px;accent-color:var(--moss);cursor:pointer}
  .fp-reset{
    width:100%;border:2px solid var(--ink);background:#fff;color:var(--ink);
    border-radius:8px;padding:7px;cursor:pointer;font-family:'Fraunces',serif;font-weight:700;font-size:12px;
  }
  .fp-reset:active{transform:translateY(1px)}
  /* heat legend */
  .heat-legend{
    position:absolute;right:14px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:900;
    background:var(--paper);border:2px solid var(--ink);border-radius:12px;
    box-shadow:3px 3px 0 var(--ink);padding:7px 9px;
    display:flex;flex-direction:column;gap:3px;
  }
  .hl-label{font-family:'Fraunces',serif;font-weight:700;font-size:11px}
  .hl-bar{width:104px;height:8px;border:1px solid var(--ink);border-radius:5px;
    background:linear-gradient(90deg,#5a7d3c,#d8a838,#b5582f,#7a1f0c)}
  .hl-ends{font-size:9px;color:var(--moss-dk);display:flex;justify-content:space-between}
  /* popup mark-cleaned button + tag */
  .pop-clean{
    margin-top:8px;width:100%;background:var(--moss);color:#fff;
    border:2px solid var(--ink);border-radius:8px;padding:8px;cursor:pointer;
    font-family:'Fraunces',serif;font-weight:700;font-size:13px;
  }
  .pop-clean:active{transform:translateY(1px)}
  .cleaned-tag{margin-top:8px;font-size:12px;color:var(--moss-dk);font-weight:500}
  .turnstile-box{margin-top:16px;min-height:0;display:flex;justify-content:center}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid var(--ink);
    border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}

  .overlay{
    position:fixed;inset:0;background:rgba(28,36,25,.55);z-index:1000;
    display:none;align-items:flex-end;justify-content:center;
  }
  .overlay.show{display:flex}
  .sheet{
    background:var(--paper);width:100%;max-width:480px;
    border:2px solid var(--ink);border-bottom:none;
    border-radius:20px 20px 0 0;padding:22px;
    box-shadow:0 -6px 0 var(--ink);
    animation:slideup .25s ease;max-height:88vh;overflow:auto;
  }
  @keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet h2{font-family:'Fraunces',serif;font-weight:900;font-size:22px;margin-bottom:4px}
  .sheet p.sub{font-size:12px;color:var(--moss-dk);margin-bottom:16px}

  label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin:14px 0 6px;font-weight:500}
  select,textarea{
    width:100%;font-family:inherit;font-size:14px;padding:10px;
    border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:54px}

  .photo-zone{
    border:2px dashed var(--ink);border-radius:12px;padding:18px;text-align:center;
    cursor:pointer;background:#fff;font-size:13px;color:var(--moss-dk);
  }
  .photo-zone img{max-width:100%;border-radius:8px;margin-top:6px;display:block}
  input[type=file]{display:none}

  .actions{display:flex;gap:10px;margin-top:20px}
  button.btn{
    flex:1;font-family:'Fraunces',serif;font-weight:700;font-size:15px;
    padding:13px;border:2px solid var(--ink);border-radius:12px;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s;
  }
  button.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  button.btn:disabled{opacity:.5;cursor:wait}
  .btn-cancel{background:var(--paper);color:var(--ink)}
  .btn-submit{background:var(--moss);color:#fff}

  .pop b{font-family:'Fraunces',serif;font-size:14px}
  .pop img{width:100%;border-radius:6px;margin-top:6px}
  .pop .meta{font-size:11px;color:#666;margin-top:4px}
  .pin{font-size:26px;filter:drop-shadow(1px 2px 1px rgba(0,0,0,.4));text-align:center;line-height:1}

  .config-warn{
    position:fixed;inset:0;background:var(--paper);z-index:2000;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:30px;gap:14px;
  }
  .config-warn.show{display:flex}
  .config-warn h2{font-family:'Fraunces',serif;font-weight:900;font-size:24px}
  .config-warn code{background:var(--ink);color:var(--paper);padding:2px 8px;border-radius:6px;font-size:13px}
  .config-warn p{max-width:420px;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="logo">💩</div>
      <h1>Poo Patrol<small>Community Hazard Map</small></h1>
    </div>
    <div class="count" id="count">…</div>
  </header>
  <div id="map">
    <button type="button" class="locate" id="locateBtn" title="Use my location">📍 My location</button>
    <div class="topright">
      <button type="button" class="ctrl-btn" id="filterBtn" title="Filter reports">⚙️ Filter</button>
      <button type="button" class="ctrl-btn" id="cleanToggle" title="Show cleaned reports">👁 Show cleaned</button>
      <div class="filter-panel" id="filterPanel">
        <div class="fp-group">
          <div class="fp-title">Severity</div>
          <label class="fp-row"><input type="checkbox" data-sev="🟢" checked> 🟢 Minor</label>
          <label class="fp-row"><input type="checkbox" data-sev="🟡" checked> 🟡 Moderate</label>
          <label class="fp-row"><input type="checkbox" data-sev="🔴" checked> 🔴 Hazard</label>
        </div>
        <div class="fp-group">
          <label class="fp-row"><input type="checkbox" id="fRecent"> 🕒 Last 7 days only</label>
          <label class="fp-row"><input type="checkbox" id="fPhoto"> 📷 With photo only</label>
        </div>
        <button type="button" class="fp-reset" id="filterReset">Reset filters</button>
      </div>
    </div>
    <div class="fab" id="fab">📍 Report a poo</div>
    <div class="heat-legend">
      <span class="hl-label">Hotspots</span>
      <span class="hl-bar"></span>
      <span class="hl-ends"><span>low</span><span>high</span></span>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2>New report</h2>
    <p class="sub" id="coords">—</p>

    <label>Severity</label>
    <select id="sev">
      <option value="🟢 Minor">🟢 Minor — small, avoidable</option>
      <option value="🟡 Moderate" selected>🟡 Moderate — watch your step</option>
      <option value="🔴 Hazard">🔴 Hazard — biohazard, call backup</option>
    </select>

    <label>Note (optional)</label>
    <textarea id="note" placeholder="e.g. next to the bench, near the big oak..."></textarea>

    <label>Photo (optional)</label>
    <div class="photo-zone" id="photoZone">
      <span id="photoText">📷 Tap to add a photo</span>
      <input type="file" id="photoInput" accept="image/*" capture="environment">
    </div>

    <div id="turnstile-box" class="turnstile-box"></div>

    <div class="actions">
      <button class="btn btn-cancel" id="cancel">Cancel</button>
      <button class="btn btn-submit" id="submit">Submit</button>
    </div>
  </div>
</div>

<div class="config-warn" id="configWarn">
  <div class="logo" style="width:60px;height:60px;font-size:32px">💩</div>
  <h2>Almost there!</h2>
  <p>Open this file and paste your Supabase <code>URL</code> and <code>anon key</code> into the
  <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> values at the top of the script.</p>
</div>

<script>
/* ============================================================
   1. PASTE YOUR SUPABASE CREDENTIALS HERE
   Find them in: Project Settings → API
   ============================================================ */
const SUPABASE_URL      = "https://vmoltbdihnkxepvtyobu.supabase.co";   // e.g. https://abcd1234.supabase.co
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtb2x0YmRpaG5reGVwdnR5b2J1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MDA0NzQsImV4cCI6MjA5NjA3NjQ3NH0.spDLNRc3jyH0XKvRcthLXKvhkgUmQuV3jv4C8MYwLps";
const TURNSTILE_SITE_KEY = "0x4AAAAAADgsach6mK7gtE6-"; // public site key from Cloudflare
/* ============================================================ */

// Edge Function endpoint that verifies the captcha and inserts the report
const SUBMIT_URL = SUPABASE_URL.replace(/\/$/, "") + "/functions/v1/submit-report";

const configured = SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 20;
let sb = null;
if (configured) {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} else {
  document.getElementById('configWarn').classList.add('show');
}

const map = L.map('map', {zoomControl:true}).setView([51.5074,-0.1278], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap', maxZoom:19
}).addTo(map);

navigator.geolocation && navigator.geolocation.getCurrentPosition(
  p => map.setView([p.coords.latitude, p.coords.longitude], 16),
  () => {}, {timeout:5000}
);

let armed = false, picked = null, photoBlob = null, tempMarker = null, justArmedAt = 0;
const fab = document.getElementById('fab');
const overlay = document.getElementById('overlay');

function pinIcon(emoji){
  return L.divIcon({html:`<div class="pin">${emoji}</div>`, className:'', iconSize:[30,30], iconAnchor:[15,28]});
}
function sevEmoji(s){return s.split(' ')[0];}

fab.addEventListener('click', (e)=>{
  e.stopPropagation();
  armed = !armed;
  fab.classList.toggle('armed', armed);
  if(armed) justArmedAt = Date.now();
  fab.textContent = armed ? '👆 Tap the map to place' : '📍 Report a poo';
  if(armed) banner('Tap the map where the poo is');
  else banner('Cancelled');
});

let bannerTimer;
function banner(text, isErr){
  clearTimeout(bannerTimer);
  let b = document.querySelector('.banner');
  if(!b){b=document.createElement('div');b.className='banner';document.getElementById('app').appendChild(b);}
  b.className = 'banner' + (isErr ? ' err' : '');
  b.textContent = text;
  bannerTimer = setTimeout(()=>b.remove(), isErr ? 4000 : 2200);
}

// ---- Turnstile widget management ----
let turnstileId = null;
let turnstileToken = null;

function renderTurnstile(){
  const box = document.getElementById('turnstile-box');
  if(!window.turnstile || TURNSTILE_SITE_KEY.startsWith('YOUR_')){ return; }
  // (re)create the widget each time the sheet opens so tokens are fresh
  box.innerHTML = '';
  turnstileToken = null;
  turnstileId = window.turnstile.render(box, {
    sitekey: TURNSTILE_SITE_KEY,
    callback: (t)=>{ turnstileToken = t; },
    'expired-callback': ()=>{ turnstileToken = null; },
    'error-callback': ()=>{ turnstileToken = null; },
  });
}
function resetTurnstile(){
  turnstileToken = null;
  if(window.turnstile && turnstileId !== null){
    try{ window.turnstile.remove(turnstileId); }catch(e){}
    turnstileId = null;
  }
  const box = document.getElementById('turnstile-box');
  if(box) box.innerHTML = '';
}

// open the report sheet at a given location (shared by map-tap and "use my location")
function placePin(latlng){
  picked = latlng;
  if(tempMarker) map.removeLayer(tempMarker);
  tempMarker = L.marker(picked, {icon:pinIcon('📌'), draggable:true}).addTo(map);
  tempMarker.on('dragend', ev=>{
    picked = ev.target.getLatLng();
    document.getElementById('coords').textContent =
      `${picked.lat.toFixed(5)}, ${picked.lng.toFixed(5)}  ·  drag pin to adjust`;
  });
  document.getElementById('coords').textContent =
    `${picked.lat.toFixed(5)}, ${picked.lng.toFixed(5)}  ·  drag pin to adjust`;
  overlay.classList.add('show');
  renderTurnstile();
}

map.on('click', e=>{
  if(!armed) return;
  // ignore a click that lands within 350ms of arming (touch pass-through)
  if(Date.now() - justArmedAt < 350) return;
  placePin(e.latlng);
});

// "Use my location" button — drops the pin exactly where the user is
const locateBtn = document.getElementById('locateBtn');
locateBtn.addEventListener('click', ()=>{
  if(!navigator.geolocation){ banner('Location not supported on this device', true); return; }
  locateBtn.disabled = true;
  const prev = locateBtn.textContent;
  locateBtn.innerHTML = '<span class="spin"></span>';
  navigator.geolocation.getCurrentPosition(
    p=>{
      const ll = L.latLng(p.coords.latitude, p.coords.longitude);
      map.setView(ll, 18);
      armed = true; fab.classList.add('armed'); fab.textContent = '👆 Tap the map to place';
      placePin(ll);
      banner('Pin placed at your location — drag to fine-tune');
      locateBtn.disabled = false; locateBtn.textContent = prev;
    },
    err=>{
      banner(err.code===1 ? 'Location permission denied' : 'Could not get your location', true);
      locateBtn.disabled = false; locateBtn.textContent = prev;
    },
    {enableHighAccuracy:true, timeout:10000, maximumAge:0}
  );
});

// photo handling with compression -> Blob for upload
const photoInput = document.getElementById('photoInput');
document.getElementById('photoZone').addEventListener('click', ()=>photoInput.click());
photoInput.addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    const img = new Image();
    img.onload = ()=>{
      const max = 1100;
      let {width:w, height:h} = img;
      if(w>h && w>max){h=h*max/w; w=max;} else if(h>max){w=w*max/h; h=max;}
      const c = document.createElement('canvas');
      c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(blob=>{
        photoBlob = blob;
        document.getElementById('photoText').textContent = '✅ Photo added — tap to change';
        let prev = document.querySelector('#photoZone img');
        if(prev) prev.remove();
        const el = document.createElement('img'); el.src = URL.createObjectURL(blob);
        document.getElementById('photoZone').appendChild(el);
      }, 'image/jpeg', 0.65);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function closeSheet(){
  overlay.classList.remove('show');
  if(tempMarker){map.removeLayer(tempMarker);tempMarker=null;}
  photoBlob=null; picked=null;
  document.getElementById('note').value='';
  document.getElementById('sev').selectedIndex=1;
  document.getElementById('photoText').textContent='📷 Tap to add a photo';
  let prev=document.querySelector('#photoZone img'); if(prev) prev.remove();
  armed=false; fab.classList.remove('armed'); fab.textContent='📍 Report a poo';
  resetTurnstile();
}
document.getElementById('cancel').addEventListener('click', closeSheet);

const submitBtn = document.getElementById('submit');
submitBtn.addEventListener('click', async ()=>{
  if(!picked || !sb) return;

  // require a captcha token (unless Turnstile isn't configured yet)
  const turnstileConfigured = !TURNSTILE_SITE_KEY.startsWith('YOUR_');
  if(turnstileConfigured && !turnstileToken){
    banner('Please complete the “I’m human” check', true);
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Saving…';
  try{
    let photo_url = null;

    // 1. upload photo if present (storage upload stays direct)
    if(photoBlob){
      const path = `${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;
      const { error: upErr } = await sb.storage.from('photos')
        .upload(path, photoBlob, {contentType:'image/jpeg'});
      if(upErr) throw upErr;
      const { data:pub } = sb.storage.from('photos').getPublicUrl(path);
      photo_url = pub.publicUrl;
    }

    // 2. send report through the Edge Function (verifies captcha, then inserts)
    const res = await fetch(SUBMIT_URL, {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer ' + SUPABASE_ANON_KEY,
        'apikey': SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({
        token: turnstileToken,
        lat: picked.lat,
        lng: picked.lng,
        sev: document.getElementById('sev').value,
        note: document.getElementById('note').value.trim() || null,
        photo_url,
      }),
    });
    const out = await res.json().catch(()=> ({}));
    if(!res.ok) throw new Error(out.error || ('Request failed ('+res.status+')'));

    const data = out.report;
    allReports.unshift(data);
    render();
    banner('Reported. Thanks, patroller! 🫡');
    closeSheet();
  }catch(err){
    console.error(err);
    banner('Save failed: ' + (err.message || 'unknown error'), true);
    // get a fresh captcha token for the retry
    if(window.turnstile && turnstileId !== null){ try{ window.turnstile.reset(turnstileId); turnstileToken=null; }catch(e){} }
  }finally{
    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit';
  }
});

const markers = {};   // id -> leaflet marker
let showCleaned = false;

function popupHtml(r){
  const when = new Date(r.created_at || Date.now()).toLocaleString();
  let html = `<div class="pop"><b>${r.sev}</b>`;
  if(r.note) html += `<div>${escapeHtml(r.note)}</div>`;
  if(r.photo_url) html += `<img src="${r.photo_url}">`;
  html += `<div class="meta">${when}</div>`;
  if(r.cleaned){
    const cwhen = r.cleaned_at ? new Date(r.cleaned_at).toLocaleDateString() : '';
    html += `<div class="cleaned-tag">✅ Marked cleaned ${cwhen}</div>`;
  }else{
    html += `<button class="pop-clean" onclick="window.markCleaned('${r.id}')">✅ Mark as cleaned</button>`;
  }
  html += `</div>`;
  return html;
}

function addMarker(r){
  const emoji = r.cleaned ? '✅' : sevEmoji(r.sev);
  const m = L.marker([r.lat,r.lng], {icon:pinIcon(emoji), opacity: r.cleaned ? 0.55 : 1}).addTo(map);
  m._report = r;
  m.bindPopup(popupHtml(r), {maxWidth:240});
  markers[r.id] = m;
}

window.markCleaned = async function(id){
  if(!sb) return;
  if(!confirm('Mark this poo as cleaned up? It will drop off the map.')) return;
  try{
    const cleaned_at = new Date().toISOString();
    const { error } = await sb.from('reports')
      .update({ cleaned:true, cleaned_at }).eq('id', id);
    if(error) throw error;

    const m = markers[id];
    if(m) m.closePopup();
    // update the source record and re-render so filters/counts stay correct
    const rec = allReports.find(r=>r.id===id);
    if(rec){ rec.cleaned = true; rec.cleaned_at = cleaned_at; }
    render();
    banner('Thanks! Marked as cleaned 🧹');
  }catch(err){
    console.error(err);
    banner('Could not update: ' + (err.message||''), true);
  }
};

function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

let activeCount = 0;
function refreshCount(shown){
  const el = document.getElementById('count');
  if(shown === undefined){ el.textContent = activeCount + (activeCount===1?' report':' reports'); return; }
  el.textContent = shown + (shown===1?' shown':' shown');
}

let allReports = [];
const filters = {
  sev: { '🟢': true, '🟡': true, '🔴': true },
  recentOnly: false,
  withPhoto: false,
};
const RECENT_MS = 7 * 24 * 60 * 60 * 1000; // 7 days

function passesFilters(r){
  // severity
  if(!filters.sev[sevEmoji(r.sev)]) return false;
  // recent only
  if(filters.recentOnly){
    const t = new Date(r.created_at || 0).getTime();
    if(Date.now() - t > RECENT_MS) return false;
  }
  // with photo only
  if(filters.withPhoto && !r.photo_url) return false;
  return true;
}

// ---- hotspot heat layer (all reports, incl. cleaned; ignores pin filters) ----
let heatLayer = null;
function renderHeat(){
  if(typeof L.heatLayer !== 'function') return; // plugin not loaded
  const points = allReports.map(r => {
    // weight hazards a bit heavier so serious spots glow more
    const w = r.sev && r.sev.startsWith('🔴') ? 1.0
            : r.sev && r.sev.startsWith('🟡') ? 0.7 : 0.5;
    return [r.lat, r.lng, w];
  });
  if(heatLayer){
    heatLayer.setLatLngs(points);
  }else{
    heatLayer = L.heatLayer(points, {
      radius: 28, blur: 20, maxZoom: 17, minOpacity: 0.25,
      gradient: {0.2:'#5a7d3c', 0.45:'#d8a838', 0.7:'#b5582f', 1.0:'#7a1f0c'}
    }).addTo(map);
  }
}

function render(){
  Object.values(markers).forEach(m=>map.removeLayer(m));
  for(const k in markers) delete markers[k];
  activeCount = 0;
  let shown = 0;
  allReports.forEach(r=>{
    if(r.cleaned && !showCleaned) return;
    if(!passesFilters(r)) return;
    addMarker(r);
    shown++;
    if(!r.cleaned) activeCount++;
  });
  renderHeat();
  refreshCount(shown);
}

async function loadAll(){
  if(!sb){document.getElementById('count').textContent='—';return;}
  try{
    const { data, error } = await sb.from('reports')
      .select('*').order('created_at',{ascending:false}).limit(2000);
    if(error) throw error;
    allReports = data;
    render();
  }catch(err){
    console.error(err);
    banner('Could not load reports: ' + (err.message||''), true);
    document.getElementById('count').textContent='—';
  }
}

// toggle to show/hide cleaned reports
const cleanToggle = document.getElementById('cleanToggle');
cleanToggle.addEventListener('click', ()=>{
  showCleaned = !showCleaned;
  cleanToggle.classList.toggle('on', showCleaned);
  cleanToggle.textContent = showCleaned ? '✅ Showing cleaned' : '👁 Show cleaned';
  render();
});

// filter panel
const filterBtn = document.getElementById('filterBtn');
const filterPanel = document.getElementById('filterPanel');
filterBtn.addEventListener('click', ()=>{
  filterPanel.classList.toggle('show');
});
// close panel when tapping outside it
document.addEventListener('click', (e)=>{
  if(!filterPanel.contains(e.target) && e.target !== filterBtn && !filterBtn.contains(e.target)){
    filterPanel.classList.remove('show');
  }
});

function filtersActive(){
  return !filters.sev['🟢'] || !filters.sev['🟡'] || !filters.sev['🔴'] ||
         filters.recentOnly || filters.withPhoto;
}
function syncFilterBtn(){
  filterBtn.classList.toggle('active', filtersActive());
  filterBtn.textContent = filtersActive() ? '⚙️ Filter •' : '⚙️ Filter';
}

document.querySelectorAll('#filterPanel input[data-sev]').forEach(cb=>{
  cb.addEventListener('change', ()=>{
    filters.sev[cb.getAttribute('data-sev')] = cb.checked;
    syncFilterBtn(); render();
  });
});
document.getElementById('fRecent').addEventListener('change', e=>{
  filters.recentOnly = e.target.checked; syncFilterBtn(); render();
});
document.getElementById('fPhoto').addEventListener('change', e=>{
  filters.withPhoto = e.target.checked; syncFilterBtn(); render();
});
document.getElementById('filterReset').addEventListener('click', ()=>{
  filters.sev = { '🟢':true, '🟡':true, '🔴':true };
  filters.recentOnly = false; filters.withPhoto = false;
  document.querySelectorAll('#filterPanel input[data-sev]').forEach(cb=>cb.checked=true);
  document.getElementById('fRecent').checked = false;
  document.getElementById('fPhoto').checked = false;
  syncFilterBtn(); render();
});

loadAll();

// register service worker for installability + fast loads (https only)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed', err));
  });
}
</script>
</body>
</html>
